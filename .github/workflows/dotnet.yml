name: build and test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup .net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: restore
        run: dotnet restore RaceDay.slnx

      - name: build
        run: dotnet build RaceDay.slnx --no-restore --configuration Release

      - name: test
        run: dotnet test RaceDay.slnx --no-build --configuration Release --verbosity normal
